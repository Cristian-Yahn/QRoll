<!doctype html>
<html lang="es" data-tema="claro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Registrar asistencia — QRoll</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/css/tema.css" />
    </head>
    <body>
        <nav
            class="navbar border-bottom"
            style="background-color: var(--bs-tertiary-bg); border-color: var(--bs-border-color)"
        >
            <div class="container">
                <a href="/index.html" class="navbar-brand mb-0 h1 d-flex align-items-center gap-2 text-decoration-none">
                    <span class="logo-app" style="width: 32px; height: 32px; font-size: 0.8rem; margin: 0">QR</span>
                    QRoll
                </a>
            </div>
        </nav>

        <div class="container py-5">
            <div class="card mx-auto" style="max-width: 420px">
                <div class="card-body text-center py-4">
                    <div
                        id="estado-icono"
                        class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3 text-bg-secondary"
                        style="width: 64px; height: 64px; font-size: 1.8rem"
                        aria-hidden="true"
                    >
                        <span class="spinner-border" role="status"></span>
                    </div>

                    <h1 id="estado-titulo" class="h5 mb-2">Registrando tu asistencia…</h1>
                    <p id="estado-mensaje" class="text-secondary-tema mb-3"></p>

                    <div id="estado-detalle" class="small mb-3 d-none">
                        <div class="fw-semibold" id="detalle-curso"></div>
                        <div class="text-secondary-tema" id="detalle-clase"></div>
                    </div>

                    <div id="estado-acciones" class="d-grid gap-2"></div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/sesion.js"></script>
        <script src="/js/preferencias.js"></script>
        <script src="/js/asistencia-rapida.js"></script>
    </body>
</html>
