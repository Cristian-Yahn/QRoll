<!doctype html>
<html lang="es" data-tema="claro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mis cursos — QRoll</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/css/tema.css" />
    </head>
    <body>
        <nav
            class="navbar border-bottom"
            style="background-color: var(--bs-tertiary-bg); border-color: var(--bs-border-color)"
        >
            <div class="container">
                <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
                    <span class="logo-app" style="width: 32px; height: 32px; font-size: 0.8rem; margin: 0">QR</span>
                    Mis cursos
                </span>
                <div>
                    <span id="nombre-usuario" class="me-3 text-secondary-tema small"></span>
                    <button id="btn-salir" class="btn btn-sm btn-outline-secondary">Cerrar sesión</button>
                </div>
            </div>
        </nav>

        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Tus cursos</h2>
                <div class="d-flex gap-2">
                    <button
                        class="btn btn-outline-primary btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#modal-unirse"
                    >
                        Unirse con código
                    </button>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modal-crear">
                        + Nuevo curso
                    </button>
                </div>
            </div>

            <div id="alerta-dashboard" class="alert d-none" role="alert"></div>

            <div id="lista-cursos" class="list-group"></div>

            <div id="sin-cursos" class="text-center text-secondary-tema py-5 d-none">
                Todavía no tenés cursos. Creá uno nuevo o unite con un código de acceso.
            </div>
        </div>

        <!-- Modal: crear curso -->
        <div class="modal fade" id="modal-crear" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Crear curso</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <form id="form-crear-curso">
                        <div class="modal-body">
                            <label for="crear-nombre-curso" class="form-label">Nombre del curso</label>
                            <input type="text" class="form-control" id="crear-nombre-curso" required />
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary w-100">Crear</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Modal: unirse a curso -->
        <div class="modal fade" id="modal-unirse" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Unirse a un curso</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <form id="form-unirse-curso">
                        <div class="modal-body">
                            <label for="unirse-codigo" class="form-label">Código de acceso</label>
                            <input
                                type="text"
                                class="form-control text-uppercase"
                                id="unirse-codigo"
                                maxlength="6"
                                required
                            />
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary w-100">Unirme</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/preferencias.js"></script>
        <script src="/js/dashboard.js"></script>
    </body>
</html>
