<!doctype html>
<html lang="es" data-tema="claro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Verificar acceso — QRoll</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/css/tema.css" />
    </head>
    <body>
        <nav
            class="navbar border-bottom"
            style="background-color: var(--bs-tertiary-bg); border-color: var(--bs-border-color)"
        >
            <div class="container">
                <a href="/login.html" class="navbar-brand mb-0 h1 d-flex align-items-center gap-2 text-decoration-none">
                    <span class="logo-app" style="width: 32px; height: 32px; font-size: 0.8rem; margin: 0">QR</span>
                    QRoll
                </a>
            </div>
        </nav>

        <div class="container py-5">
            <div class="card mx-auto" style="max-width: 420px">
                <div class="card-body p-4 text-center">
                    <h1 id="titulo" class="h5 mb-2">¿Fuiste vos?</h1>
                    <p id="mensaje" class="text-secondary-tema mb-3">
                        Detectamos varios intentos fallidos de iniciar sesión en tu cuenta de QRoll. Por seguridad, el
                        acceso está bloqueado hasta que nos confirmes.
                    </p>

                    <div id="alerta" class="alert d-none text-start" role="alert"></div>

                    <div id="acciones-pregunta" class="d-grid gap-2">
                        <button type="button" id="btn-fui-yo" class="btn btn-primary">Sí, fui yo</button>
                        <button type="button" id="btn-no-fui-yo" class="btn btn-outline-danger">
                            No fui yo: cambiar mi contraseña
                        </button>
                    </div>

                    <div id="acciones-resultado" class="d-grid gap-2 d-none"></div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/preferencias.js"></script>
        <script src="/js/verificar-acceso.js"></script>
    </body>
</html>
