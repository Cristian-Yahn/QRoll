<!doctype html>
<html lang="es" data-tema="claro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Curso — QRoll</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/css/tema.css" />
    </head>
    <body>
        <nav
            class="navbar border-bottom"
            style="background-color: var(--bs-tertiary-bg); border-color: var(--bs-border-color)"
        >
            <div class="container">
                <a href="/index.html" class="navbar-brand mb-0 h1 d-flex align-items-center gap-2 text-decoration-none">
                    <span class="logo-app" style="width: 32px; height: 32px; font-size: 0.8rem; margin: 0">OA</span>
                    <span>QRoll</span>
                </a>
                <a href="/index.html" class="btn btn-sm btn-outline-secondary">← Volver al inicio</a>
            </div>
        </nav>

        <div class="container py-4">
            <div id="alerta-curso" class="alert d-none" role="alert"></div>

            <!-- ===== Encabezado del curso ===== -->
            <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                <h1 class="h4 mb-0" id="nombre-curso">Cargando…</h1>
                <span id="badge-rol" class="badge text-bg-secondary"></span>
            </div>
            <p class="text-secondary-tema small mb-2" id="contador-alumnos"></p>
            <div id="wrap-codigo" class="small text-secondary-tema mb-4 d-none">
                Código de acceso para alumnos: <code id="codigo-acceso"></code>
            </div>

            <!-- ===== Tablón ===== -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="h6 mb-3">Tablón</h2>

                    <form id="form-publicacion" class="mb-4 d-none">
                        <div class="mb-2">
                            <textarea
                                id="publicacion-contenido"
                                class="form-control"
                                rows="2"
                                placeholder="Escribí un aviso para el curso..."
                                required
                            ></textarea>
                        </div>
                        <div class="mb-2">
                            <input
                                type="url"
                                id="publicacion-enlace"
                                class="form-control form-control-sm"
                                placeholder="Enlace (opcional, ej: Google Drive)"
                            />
                        </div>
                        <button type="submit" class="btn btn-sm btn-primary">Publicar</button>
                    </form>

                    <div id="lista-publicaciones"></div>
                    <div id="sin-publicaciones" class="text-center text-secondary-tema small py-3 d-none">
                        Todavía no hay publicaciones en este curso.
                    </div>
                </div>
            </div>

            <!-- ===== Clases ===== -->
            <div class="card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h6 mb-0">Clases</h2>
                        <button
                            id="btn-nueva-clase"
                            type="button"
                            class="btn btn-sm btn-primary d-none"
                            data-bs-toggle="modal"
                            data-bs-target="#modal-nueva-clase"
                        >
                            + Nueva clase
                        </button>
                    </div>
                    <div id="lista-clases" class="list-group"></div>
                    <div id="sin-clases" class="text-center text-secondary-tema small py-3 d-none">
                        Todavía no hay clases cargadas en este curso.
                    </div>
                </div>
            </div>
        </div>

        <!-- ===== Modal: nueva clase ===== -->
        <div class="modal fade" id="modal-nueva-clase" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Nueva clase</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <form id="form-nueva-clase">
                        <div class="modal-body">
                            <label for="nueva-clase-fecha" class="form-label">Fecha</label>
                            <input type="date" id="nueva-clase-fecha" class="form-control" required />
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Crear</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/preferencias.js"></script>
        <script src="/js/curso.js"></script>
    </body>
</html>
