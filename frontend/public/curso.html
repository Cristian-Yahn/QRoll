<!doctype html>
<html lang="es" data-tema="claro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Curso — Organizador de asistencia</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/css/tema.css" />
    </head>
    <body>
        <nav
            class="navbar border-bottom"
            style="background-color: var(--bs-tertiary-bg); border-color: var(--bs-border-color)"
        >
            <div class="container">
                <a href="/index.html" class="navbar-brand mb-0 h1 d-flex align-items-center gap-2 text-decoration-none">
                    <span class="logo-app" style="width: 32px; height: 32px; font-size: 0.8rem; margin: 0">OA</span>
                    <span id="nombre-curso">Curso</span>
                </a>
                <a href="/index.html" class="btn btn-sm btn-outline-secondary">← Mis cursos</a>
            </div>
        </nav>

        <div class="container py-4">
            <div id="alerta-curso" class="alert d-none" role="alert"></div>

            <div class="d-flex flex-wrap gap-2 align-items-center text-secondary-tema small mb-4">
                <span id="badge-rol" class="badge"></span>
                <span>·</span>
                <span id="contador-alumnos">0 alumnos inscriptos</span>
                <span id="wrap-codigo" class="d-none"> · Código: <strong id="codigo-acceso"></strong> </span>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 mb-0">Clases</h2>
                <button
                    id="btn-nueva-clase"
                    class="btn btn-primary btn-sm d-none"
                    data-bs-toggle="modal"
                    data-bs-target="#modal-nueva-clase"
                >
                    + Nueva clase
                </button>
            </div>

            <div id="lista-clases" class="list-group"></div>

            <div id="sin-clases" class="text-center text-secondary-tema py-5 d-none">
                Todavía no hay clases creadas en este curso.
            </div>
        </div>

        <!-- Modal: nueva clase (solo profesor) -->
        <div class="modal fade" id="modal-nueva-clase" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Nueva clase</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <form id="form-nueva-clase">
                        <div class="modal-body">
                            <label for="nueva-clase-fecha" class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="nueva-clase-fecha" required />
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary w-100">Crear</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/preferencias.js"></script>
        <script src="/js/curso.js"></script>
    </body>
</html>
