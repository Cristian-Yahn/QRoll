<!doctype html>
<html lang="es" data-tema="claro">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ingresar — QRoll</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="/css/tema.css" />
    </head>
    <body>
        <div class="container">
            <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh">
                <div class="card shadow-sm" style="width: 100%; max-width: 380px">
                    <div class="card-body p-4">
                        <div class="logo-app">OA</div>
                        <h1 class="h5 text-center mb-4">QRoll</h1>

                        <ul class="nav nav-tabs nav-fill mb-3" id="tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button
                                    class="nav-link active"
                                    id="tab-login-btn"
                                    data-bs-toggle="tab"
                                    data-bs-target="#tab-login"
                                    type="button"
                                    role="tab"
                                >
                                    Iniciar sesión
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button
                                    class="nav-link"
                                    id="tab-registro-btn"
                                    data-bs-toggle="tab"
                                    data-bs-target="#tab-registro"
                                    type="button"
                                    role="tab"
                                >
                                    Registrarse
                                </button>
                            </li>
                        </ul>

                        <div id="alerta" class="alert d-none" role="alert"></div>

                        <div class="tab-content">
                            <!-- Login -->
                            <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
                                <form id="form-login" novalidate>
                                    <div class="mb-3">
                                        <label for="login-email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="login-email" required />
                                    </div>
                                    <div class="mb-2">
                                        <label for="login-contrasena" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control" id="login-contrasena" required />
                                    </div>
                                    <div class="text-end mb-3">
                                        <a class="enlace-tema small" id="link-olvide">¿Olvidaste tu contraseña?</a>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                                </form>
                            </div>

                            <!-- Registro -->
                            <div class="tab-pane fade" id="tab-registro" role="tabpanel">
                                <form id="form-registro" novalidate>
                                    <div class="mb-3">
                                        <label for="reg-nombre" class="form-label">Nombre</label>
                                        <input type="text" class="form-control" id="reg-nombre" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="reg-apellido" class="form-label">Apellido</label>
                                        <input type="text" class="form-control" id="reg-apellido" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="reg-email" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="reg-email" required />
                                    </div>
                                    <div class="mb-3">
                                        <label for="reg-contrasena" class="form-label">Contraseña</label>
                                        <input
                                            type="password"
                                            class="form-control"
                                            id="reg-contrasena"
                                            required
                                            minlength="8"
                                            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                                        />
                                        <div class="form-text">
                                            Mínimo 8 caracteres: 1 mayúscula, 1 minúscula, 1 número y 1 carácter
                                            especial.
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/js/preferencias.js"></script>
        <script src="/js/login.js"></script>
    </body>
</html>
